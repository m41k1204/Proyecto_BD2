services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      - runtime:/app/data/runtime
      - ./data/demo:/app/data/demo
      - ./data/multimedia:/app/data/multimedia:ro
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"  # sin login y con /api/reset: solo esta máquina
    depends_on:
      - backend
    restart: unless-stopped

  rag:
    build:
      context: .
      dockerfile: rag/Dockerfile
    profiles: ["rag"]
    environment:
      BD2_URL: http://backend:8000
    env_file:
      - path: rag/.env
        required: false
    volumes:
      - ./data/rag:/app/data/rag
      - hf_cache:/cache/hf
    ports:
      - "127.0.0.1:8100:8100"
    depends_on:
      - backend
    restart: unless-stopped

  # Motor propio de la tienda: carga el vocabulario SIFT del catálogo, que no puede convivir con el de
  # la parte 4 en el motor general (el motor carga un solo vocabulario de fotos).
  backend-ecommerce:
    build:
      context: .
      dockerfile: backend/Dockerfile
    profiles: ["ecommerce"]
    environment:
      BD2_MODELS_DIR: /app/data/modelos_ecommerce
    volumes:
      - runtime_ecommerce:/app/data/runtime
      - ./data/multimedia:/app/data/multimedia:ro
      - ./data/modelos_ecommerce:/app/data/modelos_ecommerce:ro
    restart: unless-stopped

  ecommerce:
    build:
      context: .
      dockerfile: ecommerce/Dockerfile
    profiles: ["ecommerce"]
    environment:
      BD2_URL: http://backend-ecommerce:8000
    volumes:
      - ./data/ecommerce:/app/data/ecommerce
      # con escritura: aquí se guardan las imágenes del catálogo y, por un momento, la foto que sube el usuario
      - ./data/multimedia:/app/data/multimedia
      - ./data/modelos_ecommerce_k4096:/app/data/modelos_ecommerce_k4096:ro
    ports:
      - "127.0.0.1:8300:8300"
    depends_on:
      - backend-ecommerce
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    profiles: ["rostros"]
    restart: unless-stopped

  rostros:
    build:
      context: .
      dockerfile: rostros/Dockerfile
    profiles: ["rostros"]
    environment:
      BD2_URL: http://backend:8000
      ROSTROS_REDIS: redis://redis:6379/0
    volumes:
      - ./data/rostros:/app/data/rostros
    ports:
      - "8200:8200"
    depends_on:
      - backend
      - redis
    restart: unless-stopped

volumes:
  runtime:
  runtime_ecommerce:
  hf_cache:
